<!doctype html>
<html lang="en">
<head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>CANAGI responsive QA</title><style>body{margin:0;background:#e8e8ed;color:#25252b;font:14px system-ui}header{display:flex;align-items:center;gap:12px;padding:14px 24px}button{font:inherit;padding:8px 12px;background:white;border:1px solid #aaa;border-radius:4px;cursor:pointer}main{display:flex;justify-content:center;padding:0 0 20px}iframe{width:390px;height:844px;border:1px solid #aaa;background:white}small{margin-left:auto}</style></head>
<body><header><strong>Responsive QA</strong><button data-width="320">320 px</button><button data-width="390">390 px</button><button data-width="768">768 px</button><small>Real browser iframe viewport. Development-only fixture.</small></header><main><iframe title="Mobile preview" src="/?view=list#explore"></iframe></main><script>document.querySelectorAll('button[data-width]').forEach(button=>button.addEventListener('click',()=>{document.querySelector('iframe').style.width=button.dataset.width+'px'}))</script></body>
</html>
